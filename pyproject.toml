[project]
name = "neurolink"
version = "0.2.0"
description = "Free AI chat you can trust with your own key — becoming a document-grounded knowledge assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["test_app", "test_llm_client"]
ignore_errors = true
